name: Plant model

on:
  push:
    branches: [main]
    paths: ['ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:
    inputs:
      dataset_url:
        description: URL of a zip with train/ and val/ folders (one folder per species). Leave empty to only run the tests.
        required: false
        default: ''
      epochs:
        description: Training epochs
        default: '15'

jobs:
  test:
    name: Test the training code
    if: github.event_name != 'workflow_dispatch' || inputs.dataset_url == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q

  train:
    name: Train and export
    if: github.event_name == 'workflow_dispatch' && inputs.dataset_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-export.txt
      - name: Download dataset
        run: |
          curl -fL "${{ inputs.dataset_url }}" -o dataset.zip
          unzip -q dataset.zip -d data
      - name: Train
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: >-
          python -m pandai_ml.train --data-dir data --epochs ${{ inputs.epochs }}
          --output runs/latest ${{ secrets.WANDB_API_KEY != '' && '--wandb' || '' }}
      - name: Export to TensorFlow Lite
        run: python -m pandai_ml.export --checkpoint runs/latest/best.pt --output runs/latest
      - uses: actions/upload-artifact@v4
        with:
          name: plant-model
          path: |
            ml/runs/latest/plant_classifier.tflite
            ml/runs/latest/plant_labels.csv
            ml/runs/latest/metrics.json
