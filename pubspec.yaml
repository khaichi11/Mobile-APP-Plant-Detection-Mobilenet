name: pandai
description: "Pandai - a gamified plant-learning app for elementary school students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  crypto: ^3.0.7
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.12.1
  video_player: ^2.8.6
  chewie: ^1.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/vision-plant.tflite
    - assets/aiy_plants_V1_labelmap.csv
    - assets/WhatsApp Image 2025-09-11 at 00.38.53_838607c2.jpg
    - assets/dummy_vid2.mp4
    - assets/1.jpg
    - assets/3.jpg
    - assets/2.jpg
